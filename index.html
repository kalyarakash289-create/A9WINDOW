<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A9 OPTIMIZER - Professional Windows Optimization</title>
    <meta name="description" content="A9 Optimizer - Professional Windows PC optimizer, diagnostics, and maintenance tool" />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e17;
        color: #e2e8f0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a0e17 0%, #111827 50%, #0f172a 100%);
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .splash-screen.hidden { opacity: 0; pointer-events: none; }
      .splash-logo {
        font-size: 4rem;
        font-weight: 900;
        background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -2px;
      }
      .splash-text {
        margin-top: 1rem;
        color: #94a3b8;
        font-size: 0.875rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .splash-bar {
        margin-top: 2rem;
        width: 200px;
        height: 2px;
        background: #1e293b;
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        animation: loading 2s ease-in-out infinite;
      }
      @keyframes loading {
        0% { width: 0%; margin-left: 0; }
        50% { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-screen" id="splash">
        <div class="splash-logo">A9</div>
        <div class="splash-text">A9 OPTIMIZER</div>
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
      </div>
    </div>
    <script>
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) splash.classList.add('hidden');
        setTimeout(() => { if (splash) splash.remove(); }, 500);
      }, 2500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
